name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      STANDARD_USER_USERNAME: ${{ secrets.STANDARD_USER_USERNAME }}
      STANDARD_USER_PASSWORD: ${{ secrets.STANDARD_USER_PASSWORD }}
      INVALID_USER_USERNAME: ${{ secrets.INVALID_USER_USERNAME }}
      INVALID_USER_PASSWORD: ${{ secrets.INVALID_USER_PASSWORD }}
      LOCKED_USER_USERNAME: ${{ secrets.LOCKED_USER_USERNAME }}
      LOCKED_USER_PASSWORD: ${{ secrets.LOCKED_USER_PASSWORD }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test --reporter=line
    - name: Find Playwright report
      run: |
        find . -type d -name "*report*" -o -name "playwright-report"
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
